<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tuition Management System</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="header">
    <h1>Tuition Management System</h1>
    <p>Physics Tuition Management System</p>
</header>

<main class="dashboard">

    <h2>Dashboard</h2>

    <div class="cards">

        <div class="card">
            <h3>Institutes</h3>
            <p>Manage tuition institutes</p>

            <button onclick="showInstitutes()">View Institutes</button>
            <button onclick="showAddInstituteForm()">Add Institute</button>
        </div>

        <div class="card">
            <h3>Curricula</h3>
            <p>Manage available curricula</p>

            <button onclick="showCurricula()">View Curricula</button>
            <button onclick="showAddCurriculumForm()">Add Curriculum</button>
        </div>

        <div class="card">
            <h3>Batches</h3>
            <p>Manage student batches</p>
            <button onclick="showBatches()">View Batches</button>
        </div>

        <div class="card">
            <h3>Learning Materials</h3>
            <p>Manage learning materials</p>
            <button onclick="showMaterials()">View Materials</button>
        </div>

    </div>

    <div id="content"></div>

</main>

<script src="js/app.js"></script>

</body>
</html>
