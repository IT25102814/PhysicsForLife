<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Invoices</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<nav>
    <a href="index.html">Home</a>
    <a href="invoices.html">Invoices</a>
    <a href="payments.html">Payments</a>
    <a href="revision-proposals.html">Revision Proposals</a>
</nav>
<div class="container">
    <h1>Invoices</h1>

    <form id="invoiceForm">
        <h3>Generate New Invoice</h3>
        <label>Student ID</label>
        <input type="number" id="studentId" required>
        <label>Batch ID</label>
        <input type="number" id="batchId" required>
        <label>Billing Month</label>
        <input type="date" id="billingMonth" required>
        <label>Amount</label>
        <input type="number" step="0.01" id="amount" required>
        <label>Due Date</label>
        <input type="date" id="dueDate" required>
        <label>Generated By (tutor user_id)</label>
        <input type="number" id="generatedBy" required>
        <button type="submit">Generate Invoice</button>
    </form>

    <h3>All Invoices</h3>
    <table>
        <thead>
        <tr>
            <th>ID</th><th>Student</th><th>Batch</th><th>Month</th>
            <th>Amount</th><th>Paid</th><th>Outstanding</th><th>Due</th><th>Status</th>
        </tr>
        </thead>
        <tbody id="invoiceTableBody"></tbody>
    </table>
</div>

<script src="js/api.js"></script>
<script>
    async function loadInvoices() {
        const invoices = await apiGet("/invoices");
        const tbody = document.getElementById("invoiceTableBody");
        tbody.innerHTML = "";
        invoices.forEach(inv => {
            const outstanding = (inv.amount - inv.amountPaid).toFixed(2);
            const row = document.createElement("tr");
            row.innerHTML = `
                <td>${inv.invoiceId}</td>
                <td>${inv.studentId}</td>
                <td>${inv.batchId}</td>
                <td>${inv.billingMonth}</td>
                <td>${inv.amount}</td>
                <td>${inv.amountPaid}</td>
                <td>${outstanding}</td>
                <td>${inv.dueDate}</td>
                <td class="status-${inv.status.toLowerCase()}">${inv.status}</td>
            `;
            tbody.appendChild(row);
        });
    }

    document.getElementById("invoiceForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        await apiPost("/invoices", {
            studentId: Number(document.getElementById("studentId").value),
            batchId: Number(document.getElementById("batchId").value),
            billingMonth: document.getElementById("billingMonth").value,
            amount: Number(document.getElementById("amount").value),
            amountPaid: 0,
            dueDate: document.getElementById("dueDate").value,
            generatedBy: Number(document.getElementById("generatedBy").value)
        });
        e.target.reset();
        loadInvoices();
    });

    loadInvoices();
</script>
</body>
</html>
